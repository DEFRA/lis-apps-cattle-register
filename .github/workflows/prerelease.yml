name: 'Prerelease'

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate version
        id: version
        uses: DEFRA/lis-github-actions/actions/version@90a6d6da2ab2d9caaf7ac11ef878017b51c09fd2 # v0.10.0
        with:
          ref: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          release-type: prerelease

  build-test-pack:
    name: 'Build test and pack'
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Build, test and pack
        uses: DEFRA/lis-github-actions/actions/build-test-node@90a6d6da2ab2d9caaf7ac11ef878017b51c09fd2 # v0.10.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.sha }}
          smoke-port: '3000'
          smoke-env: |
            SESSION_CACHE_ENGINE=memory
            CDP_JWT_ISSUER=https://sts.ci.invalid
            CDP_JWT_JWKS_URI=https://sts.ci.invalid/.well-known/jwks.json
            HUB_JWT_SECRET=ci-smoke-test-hub-jwt-secret-

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      quality-gate-status: ${{ steps.sonar.outputs.quality-gate-status }}
    steps:
      - name: Run Sonar analysis
        id: sonar
        uses: DEFRA/lis-github-actions/actions/sonar-node@90a6d6da2ab2d9caaf7ac11ef878017b51c09fd2 # v0.10.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          sonar-token: ${{ secrets.LIS_SONAR_TOKEN }}

  create-tag:
    name: 'Tag Validated Commit'
    needs: [get-version, build-test-pack, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: DEFRA/lis-github-actions/actions/tag@90a6d6da2ab2d9caaf7ac11ef878017b51c09fd2 # v0.10.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.sha }}
          app-client-id: ${{ vars.LIS_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.LIS_RELEASE_APP_PRIVATE_KEY }}
